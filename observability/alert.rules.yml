groups:
  - name: infrastructure-alerts
    rules:

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target indisponível"
          description: "{{ $labels.job }} está DOWN há mais de 1 minuto."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de memória"
          description: "Memória acima de 85% por mais de 2 minutos."

      - alert: HighDiskUsage
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de disco"
          description: "Disco acima de 85% por mais de 2 minutos."



